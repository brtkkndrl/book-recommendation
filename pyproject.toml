[project]
name = "book-recommendation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BRTEK007", email = "bartoszkonderla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "isbnlib>=3.10.14",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[project.scripts]
book-recommendation = "book_recommendation:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
